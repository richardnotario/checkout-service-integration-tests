name: Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write
    
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build + start stack (Docker Compose)
        working-directory: CheckoutService
        run: |
          docker compose up -d --build

      - name: Wait for API port to respond
        run: |
          for i in {1..40}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ || true)
            if [ "$code" != "000" ]; then
              echo "API responding with HTTP $code"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 3
          done
          echo "API did not respond in time"
          docker ps -a
          exit 1

      - name: Run NUnit tests + Cobertura coverage (test harness)
        run: |
          rm -rf CheckoutService.IntegrationTests/TestResults || true
          dotnet test CheckoutService.IntegrationTests/CheckoutService.IntegrationTests.csproj \
            --settings ci/coverage.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory CheckoutService.IntegrationTests/TestResults \
            --logger "trx;LogFileName=test_results.trx"

      - name: Upload TRX test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-results
          path: 'CheckoutService.IntegrationTests/TestResults/**/*.trx'

      - name: Upload coverage (Cobertura)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-coverage
          path: 'CheckoutService.IntegrationTests/TestResults/**/coverage.cobertura.xml'

      - name: Enforce 70% coverage gate
        run: |
          chmod +x ci/check-coverage.sh
          ./ci/check-coverage.sh 0.70

          - name: Generate HTML coverage report (ReportGenerator)
          if: github.event_name == 'push' && github.ref == 'refs/heads/main'
          run: |
            dotnet tool install --global dotnet-reportgenerator-globaltool
            reportgenerator \
              -reports:"CheckoutService.IntegrationTests/TestResults/**/coverage.cobertura.xml" \
              -targetdir:"coverage-site" \
              -reporttypes:Html
            # Optional: avoid Pages 404 weirdness for deep links
            echo "<meta http-equiv='refresh' content='0; url=index.html' />" > coverage-site/404.html
  
      - name: Upload coverage site artifact for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage-site

      - name: Tear down stack
        if: always()
        working-directory: CheckoutService
        run: |
          docker compose down -v

  deploy-pages:
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4